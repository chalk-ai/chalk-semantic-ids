[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chalk-semantic-ids"
version = "0.1.0"
description = "Train and serve semantic-ID recommendations with Chalk"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "chalkcompute==2.13.1",
  "chalkpy[runtime,training]==2.160.0",
  "torch==2.9.1",
  "sentence-transformers==5.1.2",
  "transformers==4.57.6",
  "numpy==2.2.6",
  "pandas==2.2.3",
  "pyarrow==23.0.1",
  "safetensors==0.6.2",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
include = ["semantic_ids*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
